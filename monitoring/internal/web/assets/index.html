<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1118">
    <title>Pulse | Sub2API Monitor</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <div id="pageContent">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark">P</span>
          <div>
            <div class="brand-name">Pulse</div>
            <div class="brand-subtitle">Sub2API monitor</div>
          </div>
          <span class="live-pill"><i></i> LIVE</span>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="notifyButton" title="查看告警" aria-label="查看告警" aria-controls="alertDrawer" aria-expanded="false">◌</button>
          <button class="icon-button" id="refreshButton" title="刷新" aria-label="刷新">↻</button>
        </div>
      </header>

      <main>
        <section class="overview-row">
          <div class="overview-copy">
            <p class="eyebrow">SERVICE HEALTH</p>
            <h1 id="overallTitle">正在读取状态</h1>
            <p id="overallMeta" class="muted">等待第一次验证结果</p>
          </div>
          <div class="overview-controls">
            <div class="segmented" role="group" aria-label="对象类型">
              <button class="active" data-filter="group" aria-pressed="true">分组</button>
              <button data-filter="account" aria-pressed="false">账户</button>
            </div>
            <label class="select-wrap">
              <span class="sr-only">健康统计范围</span>
              <select id="windowSelect">
                <option value="1" selected>24 小时</option>
                <option value="7">7 天</option>
                <option value="30">30 天</option>
              </select>
            </label>
          </div>
        </section>

        <section class="section-heading targets-heading">
          <div>
            <p class="eyebrow">DISCOVERED TARGETS</p>
            <h2>实时健康对象</h2>
          </div>
          <div class="target-heading-meta">
            <div class="probe-status" id="probeStatus" role="status" aria-live="polite">
              <span class="probe-cooldown" aria-hidden="true"><span id="probeCountdown">--</span></span>
              <span class="probe-status-copy">
                <strong id="probeStatusText">等待巡检</strong>
                <span id="nextProbeText">正在同步周期</span>
              </span>
            </div>
            <div class="section-meta" id="sectionMeta"></div>
          </div>
        </section>
        <section class="target-grid" id="targetGrid" aria-live="polite">
          <div class="loading-state">连接监控服务中<span class="loading-dots">...</span></div>
        </section>

        <section class="usage-section" id="usageSection" aria-labelledby="usageTitle" aria-busy="false">
          <div class="section-heading usage-heading">
            <div>
              <p class="eyebrow">USAGE RANKING</p>
              <h2 id="usageTitle">Tokens 用量排行榜</h2>
            </div>
            <div class="usage-controls">
              <span class="section-meta" id="usageMeta"></span>
              <label class="select-wrap">
                <span class="sr-only">用量时间范围</span>
                <select id="usagePeriodSelect">
                  <option value="1h">最近 1 小时</option>
                  <option value="24h" selected>最近 24 小时</option>
                  <option value="today">今天</option>
                  <option value="7d">最近 1 周</option>
                  <option value="15d">最近半个月</option>
                  <option value="30d">最近 1 个月</option>
                </select>
              </label>
            </div>
          </div>
          <div class="usage-kpi-grid" id="usageKpiGrid" aria-live="polite"></div>
          <div class="usage-chart-grid">
            <article class="chart-panel">
              <div class="panel-heading">
                <div><p class="eyebrow">MODEL SHARE</p><h3>模型占比</h3></div>
                <div class="metric-toggle" role="group" aria-label="模型占比指标">
                  <button class="active" data-share-kind="model" data-share-metric="tokens" aria-pressed="true">Tokens</button>
                  <button data-share-kind="model" data-share-metric="cost" aria-pressed="false">成本</button>
                </div>
              </div>
              <div class="donut-layout" id="modelDonutLayout"></div>
            </article>
            <article class="chart-panel">
              <div class="panel-heading">
                <div><p class="eyebrow">GROUP SHARE</p><h3>分组占比</h3></div>
                <div class="metric-toggle" role="group" aria-label="分组占比指标">
                  <button class="active" data-share-kind="group" data-share-metric="tokens" aria-pressed="true">Tokens</button>
                  <button data-share-kind="group" data-share-metric="cost" aria-pressed="false">成本</button>
                </div>
              </div>
              <div class="donut-layout" id="groupDonutLayout"></div>
            </article>
            <article class="chart-panel trend-panel">
              <div class="panel-heading">
                <div><p class="eyebrow">CONSUMPTION TREND</p><h3>消耗趋势</h3></div>
                <div class="trend-heading-meta">
                  <span class="panel-meta" id="usageTrendBucket">按小时</span>
                  <div class="metric-toggle" role="group" aria-label="趋势指标">
                    <button class="active" data-trend-metric="tokens" aria-pressed="true">Tokens</button>
                    <button data-trend-metric="cost" aria-pressed="false">成本</button>
                  </div>
                </div>
              </div>
              <div class="trend-chart" id="usageTrendChart">
                <div class="trend-y-axis" id="usageYAxis" aria-hidden="true"></div>
                <div class="bar-chart-wrap"><div class="bar-chart" id="usageBarChart"></div></div>
                <div class="chart-tooltip" id="usageTrendTooltip" role="tooltip" hidden></div>
              </div>
            </article>
          </div>
        </section>
      </main>
      </div>

      <div class="alert-backdrop" id="alertBackdrop" aria-hidden="true"></div>
      <aside class="alert-drawer" id="alertDrawer" role="dialog" aria-modal="true" aria-labelledby="alertTitle" aria-hidden="true" inert>
        <div class="drawer-head">
          <div>
            <p class="eyebrow">ACTIVE SIGNALS</p>
            <h2 id="alertTitle">告警</h2>
          </div>
          <div class="drawer-actions">
            <span class="panel-meta" id="alertMeta" aria-live="polite"></span>
            <button class="icon-button" id="closeAlerts" title="关闭告警" aria-label="关闭告警">×</button>
          </div>
        </div>
        <div id="alertList" class="alert-list"></div>
      </aside>
      <div class="toast-stack" id="toastStack" aria-live="assertive"></div>
    </div>

    <dialog id="historyDialog" class="history-dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">PROBE HISTORY</p>
          <h2 id="dialogTitle">历史记录</h2>
        </div>
        <button class="icon-button" id="closeDialog" title="关闭历史记录" aria-label="关闭历史记录">×</button>
      </div>
      <div class="history-summary" id="historySummary"></div>
      <div class="history-table-wrap">
        <table>
          <caption class="sr-only">探测历史记录</caption>
          <thead><tr><th scope="col">时间</th><th scope="col">状态</th><th scope="col">首字/首字节</th><th scope="col">总耗时</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
