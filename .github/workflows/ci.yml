name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - rate-sync
          - monitoring
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - uses: actions/setup-node@v4
        if: matrix.service == 'monitoring'
        with:
          node-version: "22"
      - name: Test monitoring dashboard
        if: matrix.service == 'monitoring'
        run: node --test internal/web/dashboard_test.mjs
      - name: Test monitoring request SQL
        if: matrix.service == 'monitoring'
        env:
          MONITORING_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/monitoring_test?sslmode=disable
        run: |
          docker run --detach --name monitoring-test-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=monitoring_test postgres:18-alpine
          trap 'docker rm --force monitoring-test-postgres' EXIT
          for attempt in $(seq 1 20); do
            if docker exec monitoring-test-postgres pg_isready -U postgres -d monitoring_test; then break; fi
            sleep 1
          done
          go test ./internal/store -run TestDashboardRequestWindowsPostgres -count=1
      - run: go test ./...

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in $errors) {
              Write-Error "$($_.FullName):$($error.Extent.StartLineNumber): $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
