name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - rate-sync
          - monitoring
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - run: go test ./...

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in $errors) {
              Write-Error "$($_.FullName):$($error.Extent.StartLineNumber): $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
